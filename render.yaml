services:
  - type: web
    name: haushalt-api
    runtime: docker
    plan: starter
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: haushalt-db
          property: connectionString
      - key: COOKIE_SECRET
        generateValue: true
      - key: SUPPORT_TOKEN
        generateValue: true

  - type: web
    name: haushalt-web
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      # Vite ersetzt VITE_* Variablen zur Build-Zeit.
      # Nach dem ersten Deploy ggf. auf die tatsächliche API-URL anpassen.
      - key: VITE_API_BASE
        value: https://haushalt-api.onrender.com

databases:
  - name: haushalt-db
    plan: starter
    postgresMajorVersion: "16"
    diskSizeGB: 5
