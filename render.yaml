services:
  - type: web
    name: haushalt-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: haushalt-db
          property: connectionString
      - key: COOKIE_SECRET
        generateValue: true
      - key: SUPPORT_TOKEN
        generateValue: true

  - type: web
    name: haushalt-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite ersetzt VITE_* Variablen zur Build-Zeit.
      # Nach dem ersten Deploy ggf. auf die tatsächliche API-URL anpassen.
      - key: VITE_API_BASE
        value: https://haushalt-api.onrender.com

databases:
  # Existierender DB-Service auf Render — wird NICHT neu erstellt.
  # Blueprint matcht auf den Namen und verwendet die bestehende Instanz.
  - name: haushalt-db
    databaseName: umsatz_anonymizer
    region: frankfurt
    postgresMajorVersion: "18"
