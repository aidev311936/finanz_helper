services:
  - type: web
    name: haushalt-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/anonymizer/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: haushalt-db
          property: connectionString
      - key: COOKIE_SECRET
        generateValue: true
      - key: SUPPORT_TOKEN
        generateValue: true

  - type: web
    name: haushalt-web
    runtime: static
    rootDir: apps/anonymizer/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite ersetzt VITE_* Variablen zur Build-Zeit.
      # Nach dem ersten Deploy ggf. auf die tatsächliche API-URL anpassen.
      - key: VITE_API_BASE
        value: https://haushalt-api.onrender.com
      - key: VITE_SPARBOT_URL
        value: https://sparbot-web.onrender.com

  - type: web
    name: sparbot-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/sparbot/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8081
      - key: DATABASE_URL
        fromDatabase:
          name: haushalt-db
          property: connectionString
      - key: COOKIE_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: sparbot-web
    runtime: static
    rootDir: apps/sparbot/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://sparbot-api.onrender.com

