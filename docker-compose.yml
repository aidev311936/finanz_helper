services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: haushalt
      POSTGRES_USER: haushalt
      POSTGRES_PASSWORD: haushalt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U haushalt -d haushalt" ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/anonymizer/api
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://haushalt:haushalt@postgres:5432/haushalt
      COOKIE_SECRET: dev-secret-change
      SUPPORT_TOKEN: dev-support-token
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./apps/anonymizer/web
      target: build
    command: [ "npx", "vite", "--host", "0.0.0.0", "--port", "5173" ]
    environment:
      VITE_API_BASE: http://localhost:8080
      VITE_SPARBOT_URL: http://localhost:5174
    ports:
      - "5173:5173"
    depends_on:
      - api

  sparbot-api:
    build:
      context: ./apps/sparbot/api
    environment:
      NODE_ENV: development
      PORT: 8081
      DATABASE_URL: postgres://haushalt:haushalt@postgres:5432/haushalt
      COOKIE_SECRET: dev-secret-change
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DAILY_REQUEST_LIMIT: ${LLM_DAILY_REQUEST_LIMIT:-50}
      LLM_DAILY_TOKEN_LIMIT: ${LLM_DAILY_TOKEN_LIMIT:-100000}
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 5s
      timeout: 3s
      retries: 20

  sparbot-web:
    build:
      context: ./apps/sparbot/web
      target: build
    command: [ "npx", "vite", "--host", "0.0.0.0", "--port", "5174" ]
    environment:
      VITE_API_BASE: http://localhost:8081
    ports:
      - "5174:5174"
    depends_on:
      - sparbot-api

volumes:
  pgdata:


